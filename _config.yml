# Dependencies
markdown:            kramdown
highlighter:         rouge

# Plugins
plugins: [jekyll-paginate, jekyll-sitemap]

# Permalinks
# Use of `relative_permalinks` ensures post links from the index work properly.
permalink:           pretty

# Setup
title:               Oliver Weissl
tagline:             'Senior Data Scientist & PhD Candidate'
description:         'Oliver Weißl is a PhD candidate at the Technical University of Munich (TUM) and Senior Data Scientist at NorCom. His research is on test input generation for AI-enabled systems: generative testing of deep learning models, vision-language models and speech recognition.'
lang:                en
social_image:        /images/portrait.jpeg
url:                 https://oliverweissl.github.io
baseurl:             ''

# Ensure public directory is included in build
include:
  - public

# Collections
collections:
  project_showcase:
    output: true
    permalink: /:collection/:path/

# About/contact
author:
  name:              Oliver Weissl
  url:               https://oliverweissl.github.io
  email:             oliver.weissl@outlook.com

# Theme Author
theme:
  link:             https://github.com/ariestiyansyah/naringu
  codename:         Naringu
